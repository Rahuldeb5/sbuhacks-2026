[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: needs LM Studio with the VLM loaded (run with: pytest -m live)
    supabase: creates + deletes throwaway users in the real Supabase project (run with: pytest -m supabase)
addopts = -m "not live and not supabase"
